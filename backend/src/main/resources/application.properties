spring.application.name=backend

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/photologdb
spring.datasource.username=photologdbuser
spring.datasource.password=photologdbuser

# schema.sql is idempotent (CREATE TABLE IF NOT EXISTS) so it's safe to run on every startup
spring.sql.init.mode=always

mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.type-aliases-package=com.backend
mybatis.configuration.map-underscore-to-camel-case=true
logging.level.com.backend=trace

logging.level.org.springframework.security.web=trace

spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.max-file-size=10MB

com.backend.upload.path=upload